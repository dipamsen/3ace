<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3ace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:   #0a0f18;
    --surface: #101924;
    --ink:     #dfe8f4;
    --muted:   #8ea0b5;
    --rule:    #1f2d3d;
    --label:   #69c7c8;
    --label-bg:#163e40;
    --temp:    #8bb7ff;
    --error:   #f58d8d;
    --ui:   "Spline Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 15px/1.5 var(--ui);
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem 2rem;
    flex-wrap: wrap;
    padding: 1rem 1.5rem .75rem;
  }
  h1 { margin: 0; font: 600 1.25rem/1.2 var(--mono); letter-spacing: -.01em; }
  header p { margin: 0; color: var(--muted); flex: 1 1 18rem; }
  .pick { display: flex; align-items: center; gap: .5rem; color: var(--muted); }
  .toolbar { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
  select, button {
    font: 500 .875rem/1 var(--ui);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: .45rem .6rem;
  }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--muted); }
  select, button {
    background: rgba(255,255,255,.015);
    color: var(--ink);
  }
  .ghost {
    background: rgba(105, 199, 200, 0.08);
    border-color: rgba(105, 199, 200, 0.35);
  }
  :focus-visible { outline: 2px solid var(--label); outline-offset: 2px; }

  .modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 15, 24, 0.7);
    backdrop-filter: blur(2px);
    z-index: 20;
    padding: 1rem;
  }
  .modal.open { display: flex; }
  .modal-card {
    width: min(62rem, 100%);
    max-height: 80vh;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--rule);
  }
  .modal-header h3 {
    margin: 0;
    font: 600 1rem/1.2 var(--ui);
  }
  .close-btn {
    border: 1px solid var(--rule);
    background: transparent;
    min-width: 2.2rem;
    padding: .4rem .6rem;
  }
  .modal-body {
    padding: 1rem 1.25rem 1.25rem;
    overflow: auto;
  }
  .modal-body iframe {
    width: 100%;
    height: 60vh;
  }
  .grammar {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    font: 400 .82rem/1.7 var(--mono);
    color: var(--ink);
    background: rgba(255,255,255,.02);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 1rem;
  }

  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 1px;
    background: var(--rule);          /* shows through as the divider */
    border-top: 1px solid var(--rule);
  }
  section { background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 2.75rem; padding: 0 1.25rem;
    border-bottom: 1px solid var(--rule);
  }
  h2 { margin: 0; font: 600 .9375rem/1 var(--ui); }

  #src {
    flex: 1; min-height: 0; width: 100%;
    background: transparent; color: var(--ink);
    overflow: hidden;
  }
  #src .monaco-editor {
    min-height: 100%;
    height: 100%;
    border: 0;
  }
  #src .monaco-editor, #src .monaco-editor .margin, #src .monaco-editor .monaco-editor-background {
    background: transparent !important;
  }
  #src .monaco-editor .margin {
    border-right: 1px solid var(--rule);
    background: rgba(255,255,255,.01) !important;
  }
  #src .monaco-editor .line-numbers {
    color: var(--muted);
    font-family: var(--mono);
  }
  #src .monaco-editor .cursor {
    background: rgba(223,232,244,.75) !important;
  }
  #src .monaco-editor .selected-text,
  #src .monaco-editor .view-overlays .current-line {
    background: rgba(115, 217, 217, 0.14) !important;
  }
  #src .view-overlays .current-line { border: 1px solid rgba(115,217,217,.2); }
  #src:focus-visible { outline: 2px solid var(--label); outline-offset: -2px; }

  #status {
    padding: .6rem 1.25rem; min-height: 2.5rem;
    border-top: 1px solid var(--rule);
    color: var(--muted); font-size: .875rem;
  }
  #status .err { color: var(--error); }
  #status .note { color: var(--muted); }
  #status button.err {
    all: unset; cursor: pointer; color: var(--error); text-decoration: underline;
    text-underline-offset: 3px;
  }
  #status button.err:focus-visible { outline: 2px solid var(--error); outline-offset: 2px; }
  #status .note { display: block; margin-top: .15rem; }

  #listing {
    flex: 1; min-height: 0; overflow: auto;
    margin: 0; padding: .75rem 0 1.5rem; list-style: none;
    font: 400 .875rem/1.65 var(--mono);
    transition: opacity .15s;
  }
  #listing.stale { opacity: .4; }
  #listing li {
    display: grid;
    grid-template-columns: var(--gutter, 7rem) 1fr;
    column-gap: .75rem;
    padding: 0 1.25rem;
    white-space: pre;
  }
  .labels { text-align: right; color: var(--label); }
  .labels span { margin-left: .5ch; }
  .lbl, .jump { border-radius: 3px; }
  .jump { color: var(--label); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .lbl { cursor: pointer; }
  .lbl.hl, .jump.hl { background: var(--label-bg); outline: 2px solid var(--label-bg); }
  .tmp { color: var(--temp); }
  .end { color: var(--muted); font-family: var(--ui); font-size: .8125rem; }
  .placeholder { padding: 1rem 1.25rem; color: var(--muted); font-family: var(--ui); }

  @media (max-width: 820px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; }
    #src { min-height: 16rem; }
    #listing { min-height: 16rem; }
  }
  @media (prefers-reduced-motion: reduce) { #listing { transition: none; } }
</style>
</head>
<body>

<header>
  <h1>3ace</h1>
  <p>three address code explorer</p>
  <div class="toolbar">
    <label class="pick">Example
      <select id="sample"></select>
    </label>
    <button id="grammar-btn" class="ghost" type="button">Grammar</button>
  </div>
</header>

<div id="grammar-modal" class="modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="grammar-title">
    <div class="modal-header">
      <h3 id="grammar-title">Grammar</h3>
      <button id="close-grammar" class="close-btn" type="button" aria-label="Close grammar modal">x</button>
    </div>
    <div class="modal-body">
      <iframe src="./semantic-rules.pdf" width="100%" 
        style="border: none;" 
        title="Semantic Rules"></iframe> 
    </div>
  </div>
</div>

<main>
  <section aria-labelledby="src-h">
    <div class="bar"><h2 id="src-h">Source</h2></div>
    <div id="src" role="textbox" spellcheck="false" aria-label="Source code" aria-describedby="status"></div>
    <div id="status" role="status">Loading compiler…</div>
  </section>

  <section aria-labelledby="out-h">
    <div class="bar">
      <h2 id="out-h">Three-address code</h2>
      <button id="copy" type="button" disabled>Copy</button>
    </div>
    <ol id="listing" aria-live="polite"><li class="placeholder">Output appears here.</li></ol>
  </section>
</main>

<script src="./icg.js"></script>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
