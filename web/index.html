<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3ace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:   #0a0f18;
    --surface: #101924;
    --ink:     #dfe8f4;
    --muted:   #8ea0b5;
    --rule:    #1f2d3d;
    --label:   #69c7c8;
    --label-bg:#163e40;
    --temp:    #8bb7ff;
    --error:   #f58d8d;
    --ui:   "Spline Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 15px/1.5 var(--ui);
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem 2rem;
    flex-wrap: wrap;
    padding: 1rem 1.5rem .75rem;
  }
  h1 { margin: 0; font: 600 1.25rem/1.2 var(--mono); letter-spacing: -.01em; }
  header p { margin: 0; color: var(--muted); flex: 1 1 18rem; }
  .pick { display: flex; align-items: center; gap: .5rem; color: var(--muted); }
  .toolbar { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
  select, button {
    font: 500 .875rem/1 var(--ui);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: .45rem .6rem;
  }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--muted); }
  select, button {
    background: rgba(255,255,255,.015);
    color: var(--ink);
  }
  .ghost {
    background: rgba(105, 199, 200, 0.08);
    border-color: rgba(105, 199, 200, 0.35);
  }
  :focus-visible { outline: 2px solid var(--label); outline-offset: 2px; }

  .modal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 15, 24, 0.7);
    backdrop-filter: blur(2px);
    z-index: 20;
    padding: 1rem;
  }
  .modal.open { display: flex; }
  .modal-card {
    width: min(62rem, 100%);
    max-height: 80vh;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--rule);
  }
  .modal-header h3 {
    margin: 0;
    font: 600 1rem/1.2 var(--ui);
  }
  .close-btn {
    border: 1px solid var(--rule);
    background: transparent;
    min-width: 2.2rem;
    padding: .4rem .6rem;
  }
  .modal-body {
    padding: 1rem 1.25rem 1.25rem;
    overflow: auto;
  }
  .modal-body iframe {
    width: 100%;
    height: 60vh;
  }
  .grammar {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    font: 400 .82rem/1.7 var(--mono);
    color: var(--ink);
    background: rgba(255,255,255,.02);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 1rem;
  }

  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 1px;
    background: var(--rule);          /* shows through as the divider */
    border-top: 1px solid var(--rule);
  }
  section { background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    min-height: 2.75rem; padding: 0 1.25rem;
    border-bottom: 1px solid var(--rule);
  }
  h2 { margin: 0; font: 600 .9375rem/1 var(--ui); }

  #src {
    flex: 1; min-height: 0; width: 100%;
    background: transparent; color: var(--ink);
    overflow: hidden;
  }
  #src .monaco-editor {
    min-height: 100%;
    height: 100%;
    border: 0;
  }
  #src .monaco-editor, #src .monaco-editor .margin, #src .monaco-editor .monaco-editor-background {
    background: transparent !important;
  }
  #src .monaco-editor .margin {
    border-right: 1px solid var(--rule);
    background: rgba(255,255,255,.01) !important;
  }
  #src .monaco-editor .line-numbers {
    color: var(--muted);
    font-family: var(--mono);
  }
  #src .monaco-editor .cursor {
    background: rgba(223,232,244,.75) !important;
  }
  #src .monaco-editor .selected-text,
  #src .monaco-editor .view-overlays .current-line {
    background: rgba(115, 217, 217, 0.14) !important;
  }
  #src .view-overlays .current-line { border: 1px solid rgba(115,217,217,.2); }
  #src:focus-visible { outline: 2px solid var(--label); outline-offset: -2px; }

  #status {
    padding: .6rem 1.25rem; min-height: 2.5rem;
    border-top: 1px solid var(--rule);
    color: var(--muted); font-size: .875rem;
  }
  #status .err { color: var(--error); }
  #status .note { color: var(--muted); }
  #status button.err {
    all: unset; cursor: pointer; color: var(--error); text-decoration: underline;
    text-underline-offset: 3px;
  }
  #status button.err:focus-visible { outline: 2px solid var(--error); outline-offset: 2px; }
  #status .note { display: block; margin-top: .15rem; }

  #listing {
    flex: 1; min-height: 0; overflow: auto;
    margin: 0; padding: .75rem 0 1.5rem; list-style: none;
    font: 400 .875rem/1.65 var(--mono);
    transition: opacity .15s;
  }
  #listing.stale { opacity: .4; }
  #listing li {
    display: grid;
    grid-template-columns: var(--gutter, 7rem) 1fr;
    column-gap: .75rem;
    padding: 0 1.25rem;
    white-space: pre;
  }
  .labels { text-align: right; color: var(--label); }
  .labels span { margin-left: .5ch; }
  .lbl, .jump { border-radius: 3px; }
  .jump { color: var(--label); cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .lbl { cursor: pointer; }
  .lbl.hl, .jump.hl { background: var(--label-bg); outline: 2px solid var(--label-bg); }
  .tmp { color: var(--temp); }
  .end { color: var(--muted); font-family: var(--ui); font-size: .8125rem; }
  .placeholder { padding: 1rem 1.25rem; color: var(--muted); font-family: var(--ui); }

  @media (max-width: 820px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; }
    #src { min-height: 16rem; }
    #listing { min-height: 16rem; }
  }
  @media (prefers-reduced-motion: reduce) { #listing { transition: none; } }
</style>
</head>
<body>

<header>
  <h1>3ace</h1>
  <p>three address code explorer</p>
  <div class="toolbar">
    <label class="pick">Example
      <select id="sample"></select>
    </label>
    <button id="grammar-btn" class="ghost" type="button">Grammar</button>
  </div>
</header>

<div id="grammar-modal" class="modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="grammar-title">
    <div class="modal-header">
      <h3 id="grammar-title">Grammar</h3>
      <button id="close-grammar" class="close-btn" type="button" aria-label="Close grammar modal">x</button>
    </div>
    <div class="modal-body">
      <iframe src="./semantic-rules.pdf" width="100%" 
        style="border: none;" 
        title="Semantic Rules"></iframe> 
    </div>
  </div>
</div>

<main>
  <section aria-labelledby="src-h">
    <div class="bar"><h2 id="src-h">Source</h2></div>
    <div id="src" role="textbox" spellcheck="false" aria-label="Source code" aria-describedby="status"></div>
    <div id="status" role="status">Loading compiler…</div>
  </section>

  <section aria-labelledby="out-h">
    <div class="bar">
      <h2 id="out-h">Three-address code</h2>
      <button id="copy" type="button" disabled>Copy</button>
    </div>
    <ol id="listing" aria-live="polite"><li class="placeholder">Output appears here.</li></ol>
  </section>
</main>

<script>
  window.MonacoEnvironment = {
    getWorkerUrl: function () {
      return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
        self.MonacoEnvironment = { baseUrl: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min' };
        importScripts('https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/base/worker/workerMain.js');
      `)}`;
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.min.js"></script>
<script src="icg.js"></script>
<script>
const SAMPLES = {
  "loops and arrays": `int[10][10] a;
int i, j;

for (i = 0; i < 10; i = i + 1) {
    for (j = 0; j < 10; j = j + 1) {
        a[i][j] = 0;
    }
}

for (i = 0; i < 10; i = i + 1) {
    a[i][i] = 1;
}`,
  "short-circuiting boolean": `int x, y;
if (x < 100 || x > 200 && x != y)
    x = 0;
`,
  "control flow": `int x, y;
if (x + y < 0)
    while (y < 0)
        y = y + 1;

if (x > 0) 
    x  = x - 1;
`,
  "break and continue": `int x, y;

while (x > y) {
    x = x - 1;
    if (x == 0) break;
    if (y % 2 == 0) continue;
    y = y + 1;
}`,
  "expression": `int a, b, c, d, p;
p = a + a * (b - c) + (b - c) * d;`
};

const $ = id => document.getElementById(id);
const sourceEl = $('src'), listing = $('listing'), status = $('status'),
      copyBtn = $('copy'), sampleSel = $('sample'),
      grammarBtn = $('grammar-btn'), grammarModal = $('grammar-modal'),
      closeGrammarBtn = $('close-grammar'), grammarText = $('grammar-text');

let monacoEditor = null;
let compile = null;          // set once the wasm module is ready
let lastOutput = '';         // text form of the last successful compile (for Copy)
let lastProgram = null;      // its structured form (result.program)
let notes = [];              // lexer messages printed during a compile
let timer = 0;

const src = {
  get value() {
    return monacoEditor ? monacoEditor.getValue() : (sourceEl.dataset.value || '');
  },
  set value(next) {
    sourceEl.dataset.value = next || '';
    if (monacoEditor) monacoEditor.setValue(next || '');
  },
  focus() {
    if (monacoEditor) monacoEditor.focus();
  },
  setSelectionRange(start, end) {
    if (!monacoEditor) return;
    const startPos = offsetToPosition(this.value, start);
    const endPos = offsetToPosition(this.value, end);
    monacoEditor.setSelection({
      startLineNumber: startPos.lineNumber,
      startColumn: startPos.column,
      endLineNumber: endPos.lineNumber,
      endColumn: endPos.column
    });
    monacoEditor.revealRangeInCenter({
      startLineNumber: startPos.lineNumber,
      startColumn: startPos.column,
      endLineNumber: endPos.lineNumber,
      endColumn: endPos.column
    });
  }
};

function offsetToPosition(text, offset) {
  const before = text.slice(0, offset);
  const lines = before.split('\n');
  return {
    lineNumber: lines.length,
    column: (lines[lines.length - 1] || '').length + 1
  };
}

function attachSourceListener() {
  if (monacoEditor) {
    monacoEditor.onDidChangeModelContent(() => {
      clearTimeout(timer);
      timer = setTimeout(run, 120);
    });
    return;
  }
  sourceEl.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(run, 120);
  });
}

/* ---------- rendering ---------- */

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

// Operand: temps are tinted, everything else is plain text.
function operand(o) {
  return o.k === 'temp' ? el('span', 'tmp', o.v) : document.createTextNode(o.v);
}

// A jump target; hovering it highlights the label it points at.
function jump(target) {
  const j = el('span', 'jump', 'L' + target);
  j.dataset.l = 'L' + target;
  return j;
}

// Builds the instruction text from its structured fields.
function renderInstruction(i) {
  const f = document.createDocumentFragment();
  const add = (...parts) => parts.forEach(p => f.append(p));
  switch (i.op) {
    case 'copy':  add(operand(i.dst), ' = ', operand(i.a)); break;
    case 'bin':   add(operand(i.dst), ' = ', operand(i.a), ' ' + i.o + ' ', operand(i.b)); break;
    case 'neg':   add(operand(i.dst), ' = minus ', operand(i.a)); break;
    case 'load':  add(operand(i.dst), ' = ', operand(i.a), '[', operand(i.b), ']'); break;
    case 'store': add(operand(i.dst), '[', operand(i.a), '] = ', operand(i.b)); break;
    case 'if':    add('if ', operand(i.a), ' ' + i.o + ' ', operand(i.b), ' goto ', jump(i.target)); break;
    case 'goto':  add('goto ', jump(i.target)); break;
  }
  return f;
}

function labelGutter(labels) {
  const gutter = el('span', 'labels');
  labels.forEach(n => {
    const s = el('span', 'lbl', 'L' + n + ':');
    s.dataset.l = 'L' + n;
    gutter.append(s);
  });
  return gutter;
}

function render(program) {
  const rows = program.instrs.map(i => ({ labels: i.labels, body: renderInstruction(i) }));
  if (program.endLabels.length) {
    rows.push({ labels: program.endLabels, body: el('span', 'end', 'end of program') });
  }
  const maxLabels = rows.reduce((m, r) => Math.max(m, r.labels.length), 1);

  listing.replaceChildren();
  listing.style.setProperty('--gutter', (maxLabels * 5 + 1) + 'ch');
  rows.forEach(r => {
    const li = el('li');
    li.append(labelGutter(r.labels));
    const body = el('span');
    body.append(r.body);
    li.append(body);
    listing.append(li);
  });
}

/* Hovering a label (or a jump to it) lights up everything that refers to it. */
function highlight(target, on) {
  const l = target.dataset && target.dataset.l;
  if (!l) return;
  listing.querySelectorAll('[data-l="' + l + '"]').forEach(n => n.classList.toggle('hl', on));
}
listing.addEventListener('mouseover', e => highlight(e.target, true));
listing.addEventListener('mouseout',  e => highlight(e.target, false));

/* ---------- status line ---------- */

function setStatus(result) {
  status.replaceChildren();
  if (result.ok) {
    const n = lastProgram.instrs.length;
    status.textContent = n + (n === 1 ? ' instruction' : ' instructions');
  } else {
    const e = result.error;
    const msg = e.message.charAt(0).toUpperCase() + e.message.slice(1);
    if (e.line) {
      const b = el('button', 'err', 'Line ' + e.line + ': ' + msg);
      b.type = 'button';
      b.title = 'Select this line';
      b.addEventListener('click', () => selectLine(e.line));
      status.append(b);
    } else {
      status.append(el('span', 'err', msg));
    }
  }
  notes.forEach(t => status.append(el('span', 'note', t)));
}

function selectLine(n) {
  const lines = src.value.split('\n');
  const start = lines.slice(0, n - 1).reduce((a, l) => a + l.length + 1, 0);
  const end = start + (lines[n - 1] || '').length;
  src.focus();
  src.setSelectionRange(start, end);
}

function initMonaco() {
  if (typeof require !== 'function') return;
  require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' } });
  require(['vs/editor/editor.main'], () => {
    monacoEditor = monaco.editor.create(sourceEl, {
      value: src.value || SAMPLES[sampleSel.value],
      language: 'c',
      theme: 'vs-dark',
      minimap: { enabled: false },
      automaticLayout: true,
      fontFamily: '"Spline Sans Mono", ui-monospace, "SFMono-Regular", Consolas, monospace',
      fontSize: 14,
      lineNumbersMinChars: 3,
      scrollBeyondLastLine: false,
      smoothScrolling: true,
      padding: { top: 12, bottom: 12 },
      wordWrap: 'on'
    });
    attachSourceListener();
    run();
  });
}

/* ---------- compile ---------- */

function run() {
  if (!compile) return;
  notes = [];
  let result;
  try {
    result = JSON.parse(compile(src.value));
  } catch (e) {
    result = { ok: false, error: { message: 'internal error: ' + e.message, line: null } };
  }
  if (result.ok) {
    lastOutput = result.output;
    lastProgram = result.program;
    render(result.program);
    listing.classList.remove('stale');
    copyBtn.disabled = false;
  } else {
    // Keep the last good listing visible (dimmed) while the source is invalid.
    listing.classList.toggle('stale', !!lastOutput);
  }
  setStatus(result);
}


function openGrammar() {
  grammarModal.classList.add('open');
  grammarModal.setAttribute('aria-hidden', 'false');
  closeGrammarBtn.focus();
}

function closeGrammar() {
  grammarModal.classList.remove('open');
  grammarModal.setAttribute('aria-hidden', 'true');
  grammarBtn.focus();
}

grammarBtn.addEventListener('click', openGrammar);
closeGrammarBtn.addEventListener('click', closeGrammar);
grammarModal.addEventListener('click', e => {
  if (e.target === grammarModal) closeGrammar();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && grammarModal.classList.contains('open')) closeGrammar();
});

attachSourceListener();

copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(lastOutput);
    copyBtn.textContent = 'Copied';
  } catch (_) {
    copyBtn.textContent = 'Copy failed';
  }
  setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1200);
});

Object.keys(SAMPLES).forEach(name => sampleSel.append(new Option(name, name)));
sampleSel.addEventListener('change', () => {
  src.value = SAMPLES[sampleSel.value];
  run();
});
src.value = SAMPLES[sampleSel.value];
initMonaco();

/* ---------- start ---------- */

if (typeof createIcg !== 'function') {
  status.textContent = location.protocol === 'file:'
    ? 'Could not load the compiler. Browsers block WebAssembly on file:// pages. Serve this folder over http (for example: make serve).'
    : 'Could not load icg.js. Build it first with: make wasm';
  status.classList.add('err');
} else {
  createIcg({ print: t => notes.push(t), printErr: t => notes.push(t) })
    .then(mod => {
      compile = mod.cwrap('icg_compile', 'string', ['string']);
      run();
    })
    .catch(e => {
      status.textContent = 'Could not start the compiler: ' + e;
      status.classList.add('err');
    });
}
</script>
</body>
</html>
